<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller 360 · build 20261025-1608</title>
<style>
:root{--bg:#f4f6fa;--ink:#172033;--muted:#68758a;--line:#e1e7f0;--blue:#3c68e8;--nav:#17233b;--card:white}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{background:var(--nav);color:#c4d1eb;width:222px;position:fixed;inset:0 auto 0 0;overflow:auto;padding:18px 10px}aside .brand{padding:12px;color:white;font-size:21px;font-weight:800;letter-spacing:.3px}aside .brand small{display:block;font-size:11px;color:#a7b5d1;font-weight:500;margin-top:5px}aside .nav{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;border-radius:9px;background:transparent;color:#c6d4eb;padding:11px;margin:2px 0}aside .nav.active,aside .nav:hover{background:#315385;color:white}aside .group{padding:18px 13px 7px;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#8395b8}main{margin-left:222px;padding:22px;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:23px;margin:0}.muted{color:var(--muted)}.top .muted{font-size:12px;margin-top:4px}.button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:var(--ink)}.button.primary{background:var(--blue);color:white;border-color:var(--blue)}.button:hover{filter:brightness(.96)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #1e304308}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi strong{display:block;font-size:27px;margin:8px 0 3px}.kpi small{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#66738b;background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.3px}td,th{padding:11px;border-bottom:1px solid var(--line)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f3f7ff}.scroll{overflow-x:auto}.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{border:1px solid #d6deec;border-radius:8px;padding:9px 10px;background:white;color:var(--ink);min-width:0}input[type=search]{min-width:210px;flex:1}label{display:grid;gap:5px;color:#536179;font-size:12px}.filter label{display:flex;align-items:center;gap:7px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#edf1ff;color:#405ac0;font-size:11px;font-weight:650}.pill.green{background:#dff8ee;color:#117957}.pill.orange{background:#fff0d8;color:#a56a09}.pill.red{background:#ffe7ec;color:#a7274c}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}.tabs button{padding:10px 15px;border:0;background:none;color:#6f7d94;border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.kanban{display:grid;grid-template-columns:repeat(4,minmax(205px,1fr));gap:12px;overflow:auto}.lane{background:#f1f4fa;border:1px solid var(--line);border-radius:11px;padding:10px;min-height:275px}.lane h3{font-size:12px;margin:4px 4px 12px;display:flex;justify-content:space-between}.ticket{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;background:white;padding:12px;margin-bottom:9px;cursor:pointer;min-height:118px;box-shadow:0 1px 4px #00000008}.ticket strong{font-size:13px}.ticket p{color:#57677d;font-size:12px;margin:7px 0}.ticket small{font-size:11px;color:#7b8899}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{margin-bottom:12px}.field input,.field select,.field textarea{width:100%}dialog{border:0;border-radius:14px;padding:0;box-shadow:0 25px 100px #14213d55;width:min(860px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#101c35a0}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-body{padding:19px}.summary{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:14px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:105px;padding:8px;border:1px solid var(--line);border-radius:7px;font-size:12px}.day span{display:block;font-weight:700;margin-bottom:5px}.event{font-size:10px;background:#e8efff;color:#2452a6;padding:4px;border-radius:5px;margin:3px 0;cursor:pointer;overflow:hidden}.hidden{display:none!important}.notice{background:#eaf1ff;border:1px solid #cfddfa;padding:10px;border-radius:8px;color:#31518b;font-size:12px;margin-bottom:13px}details{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#fff}details summary{cursor:pointer;padding:12px;font-weight:700}details>div{padding:12px;border-top:1px solid var(--line)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(4,230px)}}@media(max-width:700px){aside{width:64px}aside .brand{font-size:11px;padding:8px 3px}aside .brand small,aside .nav .navtext,aside .group{display:none}aside .nav{justify-content:center}main{margin-left:64px;padding:12px}.cards,.grid{grid-template-columns:1fr}.top h1{font-size:19px}}
</style><link rel="stylesheet" href="./ot-editor.css"></head><body>
<aside><div class="brand"><img src="./rubinstein-logo.svg?v=3" alt="RUBINSTEIN Mecánica Automotriz" style="display:block;width:100%;max-height:130px;object-fit:contain;margin:0 auto 10px">TALLER 360<small id="side-company">Plataforma de gestión</small></div><div id="nav"></div></aside>
<main><div style="font:11px system-ui;color:#64748b;text-align:right;margin:-8px 0 5px">Versión web: 20261025-1608</div><header class="top"><div style="display:flex;align-items:center;gap:15px"><img src="./rubinstein-logo.svg?v=3" alt="RUBINSTEIN" style="width:106px;height:66px;object-fit:contain;flex:none"><div><h1 id="heading">Dashboard</h1><div class="muted" id="subtitle">Gestión integral del taller</div></div></div><div class="row"><span class="pill green">● Demo local</span><button class="button" onclick="openCompany()">⚙ Empresa</button><button class="button primary" onclick="openOT()">+ Nueva OT</button></div></header><div id="app"></div></main>
<dialog id="modal"><div class="modal-head"><strong id="modal-title"></strong><button class="button" onclick="modal.close()">✕</button></div><div id="modal-body" class="modal-body"></div></dialog>
<script>
const seed={
 company:{nombre:'Mi Taller',rut:'',telefono:'',correo:'',direccion:'',color:'#3c68e8'},
 clients:[{id:'C1',nombre:'Transportes Norte',rut:'76.123.456-7',telefono:'+56 9 5555 1111',email:'contacto@ejemplo.cl'},{id:'C2',nombre:'Carla Díaz',rut:'12.345.678-9',telefono:'+56 9 5555 2222',email:'carla@ejemplo.cl'},{id:'C3',nombre:'Mario Soto',rut:'13.245.876-5',telefono:'+56 9 5555 3333',email:'mario@ejemplo.cl'}],
 vehicles:[{id:'V1',clienteId:'C1',patente:'RTLS08',marca:'Peugeot',modelo:'Boxer',anio:2021,km:124500},{id:'V2',clienteId:'C2',patente:'PGHZ91',marca:'Kia',modelo:'Rio',anio:2018,km:86320},{id:'V3',clienteId:'C3',patente:'KLTR22',marca:'Toyota',modelo:'Hilux',anio:2020,km:78500}],
 plans:[{id:'P1',nombre:'Mantención general 10.000 km',tipo:'Odómetro',intervalo:10000,tareas:['Cambio de aceite','Filtro de aceite','Inspección de frenos','Control de niveles']},{id:'P2',nombre:'Inspección preventiva semestral',tipo:'Meses',intervalo:6,tareas:['Escaneo preventivo','Inspección de suspensión','Revisión de neumáticos']}],
 ots:[{id:'OT-1001',vehicleId:'V1',servicio:'Revisión general',estado:'pendiente',prioridad:'Alta',tecnico:'Carlos',fecha:'2026-10-27',tareas:[{nombre:'Diagnóstico',done:false}]},{id:'OT-1002',vehicleId:'V2',servicio:'Diagnóstico de frenos',estado:'ejecucion',prioridad:'Media',tecnico:'Diego',fecha:'2026-10-28',tareas:[{nombre:'Inspección visual',done:true},{nombre:'Medición de discos',done:false}]},{id:'OT-1003',vehicleId:'V3',servicio:'Mantención 80.000 km',estado:'revision',prioridad:'Normal',tecnico:'Mario',fecha:'2026-10-29',tareas:[{nombre:'Cambio de aceite',done:true},{nombre:'Inspección final',done:false}]}],
 readings:[{id:'K1',vehicleId:'V3',km:75000,fecha:'2026-08-01'},{id:'K2',vehicleId:'V3',km:78500,fecha:'2026-10-20'}]
};
let db;try{db=JSON.parse(localStorage.getItem('taller360-demo-v1'))||structuredClone(seed)}catch{db=structuredClone(seed)}
const save=()=>localStorage.setItem('taller360-demo-v1',JSON.stringify(db));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=id=>db.clients.find(x=>x.id===id),vehicle=id=>db.vehicles.find(x=>x.id===id);
const statuses={pendiente:'Pendiente / Programada',ejecucion:'En ejecución',revision:'Control y revisión',terminada:'Terminada / Entregada'};
const navGroups=[['GENERAL',[['dashboard','▦','Dashboard'],['clientes','♙','Clientes'],['vehiculos','▰','Vehículos']]],['OPERACIONES',[['ot','▤','Órdenes de trabajo'],['planes','◷','Planes de mantenimiento'],['agenda','▦','Agenda y calendario']]],['GESTIÓN',[['almacen','▣','Almacenes y repuestos'],['personal','♧','Personal / RRHH'],['bi','▥','BI e indicadores'],['config','⚙','Configuración']]]];
let page='dashboard',otView='lista',filters={buscar:'',estado:'todos',prioridad:'todos'};
function layout(){ $('nav').innerHTML=navGroups.map(([title,items])=>'<div class="group">'+title+'</div>'+items.map(([key,ico,label])=>'<button class="nav '+(key===page?'active':'')+'" onclick="goto(\''+key+'\')">'+ico+' <span class="navtext">'+label+'</span></button>').join('')).join('');$('heading').textContent={dashboard:'Dashboard',clientes:'Clientes',vehiculos:'Vehículos',ot:'Órdenes de trabajo',planes:'Planes de mantenimiento',agenda:'Agenda y calendario',almacen:'Almacenes',personal:'Personal y RRHH',bi:'Inteligencia de negocio',config:'Configuración'}[page];$('side-company').textContent=db.company.nombre;document.documentElement.style.setProperty('--blue',db.company.color||'#3c68e8')}
function goto(p){page=p;render()}
function pill(s){return '<span class="pill '+(s==='Alta'?'red':s==='Media'?'orange':s==='terminada'?'green':'')+'">'+esc(statuses[s]||s)+'</span>'}
function render(){layout();let html='';if(page==='dashboard')html=dashboard();if(page==='clientes')html=clientsPage();if(page==='vehiculos')html=vehiclesPage();if(page==='ot')html=otPage();if(page==='planes')html=plansPage();if(page==='agenda')html=agendaPage();if(page==='config')html=configPage();if(page==='personal')html=window.T360Personnel?.page()||'<div class="card">Cargando módulo de personal...</div>';if(page==='almacen'||page==='bi')html=genericPage();$('app').innerHTML=html;if(page==='personal')window.T360Personnel?.init();}
function dashboard(){return '<div class="notice">Entorno de diseño. Datos ficticios guardados solo en este navegador. Sin conexión a Supabase.</div><div class="cards">'+[['Clientes',db.clients.length],['Vehículos',db.vehicles.length],['OT abiertas',db.ots.filter(o=>o.estado!=='terminada').length],['Planes de mantenimiento',db.plans.length]].map(([l,n])=>'<div class="card kpi"><small>'+l+'</small><strong>'+n+'</strong><small>Datos demostrativos</small></div>').join('')+'</div><div class="grid"><div class="card"><h3>Trabajos recientes</h3>'+tableOT(db.ots.slice(0,6))+'</div><div class="card"><h3>Relaciones del sistema</h3><p>Cliente → Vehículos → OT → Subtareas</p><p>Vehículo → Lecturas de odómetro → Plan de mantenimiento</p><p>OT → Costos → Reportes</p><button class="button primary" onclick="goto(\'ot\')">Ver trabajos →</button></div></div>'}
function clientsPage(){return '<div class="card"><div class="row spread"><h3>Directorio de clientes</h3><button class="button primary" onclick="newClient()">+ Cliente</button></div><div class="scroll"><table><thead><tr><th>Cliente</th><th>RUT</th><th>Contacto</th><th>Vehículos</th></tr></thead><tbody>'+db.clients.map(c=>'<tr data-id onclick="openClient(\''+c.id+'\')"><td><strong>'+esc(c.nombre)+'</strong></td><td>'+esc(c.rut)+'</td><td>'+esc(c.telefono)+'</td><td>'+db.vehicles.filter(v=>v.clienteId===c.id).length+'</td></tr>').join('')+'</tbody></table></div></div>'}
function vehiclesPage(){return '<div class="card"><div class="row spread"><h3>Vehículos y fichas técnicas</h3><button class="button primary" onclick="newVehicle()">+ Vehículo</button></div><div class="scroll"><table><thead><tr><th>Patente</th><th>Marca / Modelo</th><th>Propietario</th><th>Odómetro</th><th>OT</th></tr></thead><tbody>'+db.vehicles.map(v=>'<tr data-id onclick="openVehicle(\''+v.id+'\')"><td><strong>'+esc(v.patente)+'</strong></td><td>'+esc(v.marca+' '+v.modelo+' '+v.anio)+'</td><td>'+esc(client(v.clienteId)?.nombre)+'</td><td>'+Number(v.km).toLocaleString('es-CL')+' km</td><td>'+db.ots.filter(o=>o.vehicleId===v.id).length+'</td></tr>').join('')+'</tbody></table></div></div>'}
function tableOT(rows){return '<div class="scroll"><table><thead><tr><th>OT</th><th>Vehículo</th><th>Cliente</th><th>Servicio</th><th>Estado</th><th>Prioridad</th></tr></thead><tbody>'+rows.map(o=>{let v=vehicle(o.vehicleId);return '<tr data-id onclick="openOTDetail(\''+o.id+'\')"><td><strong>'+esc(o.id)+'</strong></td><td>'+esc(v?.patente)+'</td><td>'+esc(client(v?.clienteId)?.nombre)+'</td><td>'+esc(o.servicio)+'</td><td>'+pill(o.estado)+'</td><td>'+pill(o.prioridad)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function matched(){return db.ots.filter(o=>{const v=vehicle(o.vehicleId);const q=filters.buscar.toLowerCase();return (filters.estado==='todos'||o.estado===filters.estado)&&(filters.prioridad==='todos'||o.prioridad===filters.prioridad)&&[o.id,o.servicio,v?.patente,client(v?.clienteId)?.nombre].some(s=>String(s||'').toLowerCase().includes(q))})}
function otPage(){let rows=matched();return '<div class="card"><div class="row spread"><div class="tabs">'+[['lista','Lista'],['kanban','Kanban'],['calendario','Calendario']].map(([k,l])=>'<button class="'+(otView===k?'active':'')+'" onclick="otView=\''+k+'\';render()">'+l+'</button>').join('')+'</div><button class="button primary" onclick="openOT()">+ Nueva OT</button></div><div class="filter"><input type="search" placeholder="Patente, cliente, N° OT o servicio" value="'+esc(filters.buscar)+'" oninput="filters.buscar=this.value;refreshOT()"><label>Estado <select onchange="filters.estado=this.value;refreshOT()"><option value="todos">Todos</option>'+Object.entries(statuses).map(([k,l])=>'<option value="'+k+'" '+(filters.estado===k?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label>Prioridad <select onchange="filters.prioridad=this.value;refreshOT()"><option value="todos">Todas</option>'+['Normal','Media','Alta','Urgente'].map(x=>'<option '+(filters.prioridad===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><button class="button" onclick="filters={buscar:\'\',estado:\'todos\',prioridad:\'todos\'};render()">Limpiar</button></div><div id="ot-results">'+otResults(rows)+'</div></div>'}
function refreshOT(){const el=$('ot-results');if(el)el.innerHTML=otResults(matched())}
function otResults(rows){if(otView==='lista')return tableOT(rows);if(otView==='kanban')return '<div class="kanban">'+Object.entries(statuses).map(([key,label])=>'<div class="lane" ondragover="event.preventDefault()" ondrop="dropOT(event,\''+key+'\')"><h3>'+label+' <span>'+rows.filter(o=>o.estado===key).length+'</span></h3>'+rows.filter(o=>o.estado===key).map(o=>'<div draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+o.id+'\')" onclick="openOTDetail(\''+o.id+'\')" class="ticket"><strong>'+esc(o.id)+' · '+esc(vehicle(o.vehicleId)?.patente)+'</strong><p>'+esc(o.servicio)+'</p><div class="row">'+pill(o.prioridad)+'<small>'+esc(o.fecha)+'</small></div></div>').join('')+'</div>').join('')+'</div>';return calendarHtml(rows)}
function dropOT(e,status){e.preventDefault();let id=e.dataTransfer.getData('text/plain');let o=db.ots.find(x=>x.id===id);if(o){o.estado=status;save();render()}}
function calendarHtml(ots){const days=Array.from({length:31},(_,i)=>i+1);let leading=3;return '<div class="row spread"><h3>Octubre 2026 · Fechas de OT</h3><small>Vista demostrativa</small></div><div class="calendar">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>'<strong style="text-align:center;font-size:11px">'+x+'</strong>').join('')+Array.from({length:leading},()=>'<div></div>').join('')+days.map(d=>'<div class="day"><span>'+d+'</span>'+ots.filter(o=>o.fecha==='2026-10-'+String(d).padStart(2,'0')).map(o=>'<div class="event" onclick="openOTDetail(\''+o.id+'\')">'+esc(o.id)+' '+esc(vehicle(o.vehicleId)?.patente)+'</div>').join('')+'</div>').join('')+'</div>'}
function agendaPage(){return '<div class="card">'+calendarHtml(db.ots)+'</div>'}
function plansPage(){return '<div class="card"><h3>Planes de mantenimiento</h3><div class="notice">Planes vinculables a la creación de OT. Frecuencia de referencia por odómetro o meses.</div>'+db.plans.map(p=>'<details><summary>'+esc(p.nombre)+' · '+esc(p.tipo)+' cada '+p.intervalo+'</summary><div>'+p.tareas.map(x=>'<p>✓ '+esc(x)+'</p>').join('')+'<button class="button" onclick="openOT(null,\''+p.id+'\')">Crear OT desde este plan</button></div></details>').join('')+'</div>'}
function genericPage(){return '<div class="card"><h3>Módulo en diseño</h3><p class="muted">Estructura definida para su próxima implementación. No se han realizado cambios a la base de datos.</p></div>'}
function configPage(){return '<div class="card"><h3>Empresa e identidad visual</h3><p class="muted">El nombre de la empresa y el color se pueden configurar sin cambiar el código.</p><button class="button primary" onclick="openCompany()">Editar datos de empresa</button></div><div class="card"><h3>Otros apartados previstos</h3><p>Usuarios y perfiles · Permisos · Campos personalizados · Calendario laboral · Formularios · Alertas · Facturación · Plan y cuenta</p></div>'}
function showModal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal').showModal()}
function openCompany(){let c=db.company;showModal('Configuración de empresa','<form onsubmit="event.preventDefault();db.company.nombre=this.nombre.value;db.company.rut=this.rut.value;db.company.telefono=this.telefono.value;db.company.correo=this.correo.value;db.company.direccion=this.direccion.value;db.company.color=this.color.value;save();modal.close();render()"><div class="grid">'+['nombre','rut','telefono','correo','direccion'].map(k=>'<label class="field">'+k.toUpperCase()+'<input name="'+k+'" value="'+esc(c[k])+'"></label>').join('')+'<label class="field">Color corporativo<input type="color" name="color" value="'+esc(c.color)+'"></label></div><button class="button primary">Guardar empresa</button></form>')}
function newClient(){showModal('Nuevo cliente','<form onsubmit="event.preventDefault();db.clients.push({id:\'C\'+Date.now(),nombre:this.nombre.value,rut:this.rut.value,telefono:this.telefono.value,email:this.email.value});save();modal.close();render()"><div class="grid">'+['nombre','rut','telefono','email'].map(k=>'<label class="field">'+k.toUpperCase()+'<input required name="'+k+'"></label>').join('')+'</div><button class="button primary">Guardar cliente</button></form>')}
function newVehicle(){showModal('Nuevo vehículo','<form onsubmit="event.preventDefault();db.vehicles.push({id:\'V\'+Date.now(),clienteId:this.clienteId.value,patente:this.patente.value.toUpperCase(),marca:this.marca.value,modelo:this.modelo.value,anio:Number(this.anio.value),km:Number(this.km.value)});save();modal.close();render()"><div class="grid"><label class="field">Propietario<select name="clienteId">'+db.clients.map(c=>'<option value="'+c.id+'">'+esc(c.nombre)+'</option>').join('')+'</select></label>'+['patente','marca','modelo','anio','km'].map(k=>'<label class="field">'+k.toUpperCase()+'<input required name="'+k+'" type="'+(['anio','km'].includes(k)?'number':'text')+'"></label>').join('')+'</div><button class="button primary">Guardar vehículo</button></form>')}
function openClient(id){let c=client(id);showModal('Cliente · '+c.nombre,'<div class="summary"><strong>'+esc(c.nombre)+'</strong><p>RUT: '+esc(c.rut)+' · Teléfono: '+esc(c.telefono)+'</p><p>'+esc(c.email)+'</p></div><h3>Vehículos vinculados</h3>'+db.vehicles.filter(v=>v.clienteId===id).map(v=>'<p><button class="button" onclick="openVehicle(\''+v.id+'\')">'+esc(v.patente)+' · '+esc(v.marca+' '+v.modelo)+' →</button></p>').join(''))}
function openVehicle(id){let v=vehicle(id),c=client(v.clienteId),reads=db.readings.filter(r=>r.vehicleId===id).sort((a,b)=>a.km-b.km);showModal('Ficha del vehículo · '+v.patente,'<div class="summary"><strong style="font-size:19px">🚘 '+esc(v.marca+' '+v.modelo)+' · '+esc(v.anio)+'</strong><p>Patente: '+esc(v.patente)+' · Odómetro actual: '+v.km.toLocaleString('es-CL')+' km</p><button class="button" onclick="openClient(\''+c.id+'\')">Propietario: '+esc(c.nombre)+' ↗</button></div><details open><summary>Historial de órdenes de trabajo</summary><div>'+db.ots.filter(o=>o.vehicleId===id).map(o=>'<p><button class="button" onclick="openOTDetail(\''+o.id+'\')">'+esc(o.id+' · '+o.servicio)+'</button></p>').join('')+'</div></details><details open><summary>Odómetro histórico</summary><div><p>'+reads.map(r=>esc(r.fecha)+': '+r.km.toLocaleString('es-CL')+' km').join('<br>')+'</p><form onsubmit="event.preventDefault();addReading(\''+id+'\',this.km.value,this.fecha.value)"><div class="row"><input name="km" required type="number" min="'+v.km+'" placeholder="Nueva lectura"><input type="date" name="fecha" required value="2026-10-25"><button class="button primary">Agregar lectura</button></div></form></div></details>')}
function addReading(id,km,date){let v=vehicle(id);km=Number(km);if(!Number.isInteger(km)||km<v.km){alert('El kilometraje no puede ser menor que el actual');return}db.readings.push({id:'K'+Date.now(),vehicleId:id,km,fecha:date});v.km=km;save();openVehicle(id)}
function openOT(forVehicle=null,planId=null){let plan=db.plans.find(p=>p.id===planId);showModal('Crear orden de trabajo','<form onsubmit="createOT(event,this)"><div class="grid"><label class="field">Vehículo / cliente<select name="vehicleId">'+db.vehicles.map(v=>'<option value="'+v.id+'" '+(v.id===forVehicle?'selected':'')+'>'+esc(v.patente)+' · '+esc(client(v.clienteId)?.nombre)+' · '+esc(v.marca+' '+v.modelo)+'</option>').join('')+'</select></label><label class="field">Plan existente<select name="planId" onchange="this.form.servicio.value=this.selectedOptions[0].dataset.name||this.form.servicio.value"><option value="">OT no programada</option>'+db.plans.map(p=>'<option value="'+p.id+'" data-name="'+esc(p.nombre)+'" '+(p.id===planId?'selected':'')+'>'+esc(p.nombre)+'</option>').join('')+'</select></label><label class="field">Descripción del servicio<input name="servicio" required value="'+esc(plan?.nombre||'')+'"></label><label class="field">Prioridad<select name="prioridad"><option>Normal</option><option>Media</option><option>Alta</option><option>Urgente</option></select></label><label class="field">Estado<select name="estado"><option value="pendiente">Pendiente / Programada</option><option value="ejecucion">En ejecución</option></select></label><label class="field">Fecha prevista<input name="fecha" type="date" required value="2026-10-27"></label><label class="field">Técnico<input name="tecnico" placeholder="Responsable"></label></div><label class="field">Subtareas adicionales (una por línea)<textarea name="tareas" rows="4" placeholder="Diagnóstico&#10;Revisión de seguridad"></textarea></label><button class="button primary">Crear OT</button></form>')}
function createOT(e,f){e.preventDefault();let p=db.plans.find(x=>x.id===f.planId.value);let tasks=[...(p?.tareas||[]),...f.tareas.value.split('\n').map(x=>x.trim()).filter(Boolean)];let o={id:'OT-'+Date.now().toString().slice(-7),vehicleId:f.vehicleId.value,servicio:f.servicio.value,prioridad:f.prioridad.value,estado:f.estado.value,fecha:f.fecha.value,tecnico:f.tecnico.value,tareas:tasks.map(nombre=>({nombre,done:false}))};db.ots.unshift(o);save();modal.close();goto('ot');openOTDetail(o.id)}
function openOTDetail(id){let o=db.ots.find(x=>x.id===id),v=vehicle(o.vehicleId);showModal('Orden de trabajo · '+o.id,'<div class="summary"><h3>'+esc(o.servicio)+'</h3><p>'+esc(v?.patente)+' · '+esc(client(v?.clienteId)?.nombre)+'</p><p>'+pill(o.estado)+' '+pill(o.prioridad)+' · '+esc(o.fecha)+' · Técnico '+esc(o.tecnico||'Sin asignar')+'</p><button class="button" onclick="openVehicle(\''+v.id+'\')">Abrir vehículo relacionado ↗</button></div><details open><summary>Subtareas ('+o.tareas.filter(t=>t.done).length+'/'+o.tareas.length+')</summary><div>'+o.tareas.map((t,i)=>'<p><label><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask(\''+id+'\','+i+',this.checked)"> '+esc(t.nombre)+'</label></p>').join('')+'<div class="row"><input id="task-input" placeholder="Nueva subtarea"><button class="button" onclick="addTask(\''+id+'\')">+ Agregar</button></div></div></details><details><summary>Documentación y firmas</summary><div>Impresión y firma digital: pendiente de integración en esta nueva base neutra.</div></details><p><button class="button primary" onclick="window.print()">Imprimir vista</button></p>')}
function toggleTask(id,i,checked){let o=db.ots.find(x=>x.id===id);if(checked&&o.tareas[i].adjuntoObligatorio&&!(o.tareas[i].extras?.adjuntos?.length)){alert('Esta subtarea requiere al menos un adjunto antes de finalizar.');openOTDetail(id);return}o.tareas[i].done=checked;save();openOTDetail(id)}
function addTask(id){let s=$('task-input').value.trim();if(!s)return;db.ots.find(x=>x.id===id).tareas.push({nombre:s,done:false});save();openOTDetail(id)}
save();render();
</script><script type="module" src="./auth.js?v=20261025-2"></script><script src="./ot-editor.js?v=plan-assign-1"></script><script src="./ot-detail.js?v=dual-ot-1"></script><script src="./autocomplete.js?v=20261025-2"></script><script type="module" src="./tecnicos-supabase.js?v=20261025-2"></script><script type="module" src="./personal.js?v=20261025-seed3"></script><script src="./ot-print.js?v=dual-ot-1"></script><script src="./logo-config.js?v=1"></script><script src="./ot-signatures.js?v=sign2"></script><script src="./ot-task-extras.js?v=cloud8"></script><script src="./ot-extras-summary.js?v=1"></script><script src="./ot-execution.js?v=cloud8"></script><script type="module" src="./ot-cloud.js?v=cloud8"></script><script src="./vehiculos-imagen.js?v=1"></script><script src="./planes-v2.js?v=1"></script><script src="./planes-alertas.js?v=2"></script><script src="./planes-asignaciones.js?v=1"></script><script src="./planes-automatizaciones-pro.js?v=1"></script></body></html>
